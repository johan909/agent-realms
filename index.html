<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Realms</title>
<meta name="description" content="A neon 3D city where AI agents walk between buildings doing tasks, next to neighbour districts whose work stays private.">
<style>
  :root {
    --bg: #07040f; --panel: rgba(16, 10, 32, .78); --ink: #ece8ff; --muted: #a49cc4;
    --line: rgba(160, 120, 255, .28); --accent: #ff2e88; --cyan: #38e8ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 13px/1.45 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  #scene { position: fixed; inset: 0; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .hud { position: fixed; z-index: 2; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #top { top: 16px; left: 16px; right: 16px; max-width: 760px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  h1 { margin: 0; font-size: 16px; letter-spacing: .5px; text-shadow: 0 0 12px var(--accent); }
  #top p { margin: 0; color: var(--muted); flex-basis: 100%; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; color: var(--ink); background: rgba(255,255,255,.04); border: 1px solid var(--line);
    padding: 6px 10px; border-radius: 7px; cursor: pointer; }
  button:hover { border-color: var(--cyan); }
  button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 10px rgba(255,46,136,.5) inset; }
  label.toggle { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; color: var(--muted); }
  label.toggle input { accent-color: var(--accent); }
  #side { right: 16px; bottom: 16px; width: 300px; max-height: 46vh; padding: 12px 14px; overflow: auto; }
  #side h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  #log { list-style: none; margin: 0; padding: 0; }
  #log li { padding: 5px 0; border-bottom: 1px dashed var(--line); color: var(--muted); }
  #log li b { color: var(--ink); }
  #legend { left: 16px; bottom: 16px; padding: 10px 12px; display: grid; grid-template-columns: auto auto; gap: 4px 14px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  @media (max-width: 720px) {
    #side { left: 16px; right: 16px; width: auto; max-height: 26vh; }
    #legend { display: none; }
  }
  .tag { font: 11px/1.2 "JetBrains Mono", ui-monospace, monospace; color: #fff; background: rgba(10, 6, 24, .82);
    border: 1px solid rgba(255,255,255,.35); padding: 3px 7px; border-radius: 5px; white-space: nowrap;
    transform: translateY(-14px); transition: opacity .25s; }
  .tag.walk { opacity: .7; border-style: dashed; }
  .tag.private { letter-spacing: 2px; }
  .tag b { font-weight: 600; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>

<div class="hud" id="top">
  <h1>AGENT REALMS</h1>
  <div class="btns" id="districts"></div>
  <label class="toggle"><input type="checkbox" id="visitor"> Visitor view</label>
  <p>Your district shows what every agent is doing. Neighbour districts show who is busy, never what they are working on. Drag to orbit, scroll to zoom.</p>
</div>

<div class="hud" id="legend"></div>

<div class="hud" id="side">
  <h2>Your district · activity</h2>
  <ul id="log"><li>Agents are heading to work…</li></ul>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ---------- building types ----------
const TYPES = {
  library: { name: 'LIBRARY', color: 0xb04bff, css: '#b04bff', tasks: ['Researching competitors', 'Reading API docs', 'Summarising a paper', 'Collecting sources'] },
  forge:   { name: 'FORGE', color: 0xff5a36, css: '#ff5a36', tasks: ['Fixing login bug', 'Writing unit tests', 'Refactoring parser', 'Reviewing a PR'] },
  post:    { name: 'POST', color: 0x2f8bff, css: '#2f8bff', tasks: ['Drafting client email', 'Sorting the inbox', 'Sending weekly report', 'Booking a meeting'] },
  market:  { name: 'MARKET', color: 0xffc83d, css: '#ffc83d', tasks: ['Updating price list', 'Qualifying leads', 'Comparing suppliers', 'Preparing an invoice'] },
  hub:     { name: 'HQ', color: 0xff2e88, css: '#ff2e88', tasks: ['Planning the sprint', 'Writing a status update', 'Triaging new tasks'] },
};
const TYPE_KEYS = Object.keys(TYPES);

const DISTRICTS = [
  { id: 'mine', name: 'Your district', offset: -0, owner: true, agents: 14, seed: 7 },
  { id: 'neon', name: 'Neon Row', offset: -64, owner: false, agents: 10, seed: 21 },
  { id: 'harbor', name: 'Harbor Heights', offset: 64, owner: false, agents: 10, seed: 42 },
];
const NAMES = ['Ada', 'Bram', 'Cleo', 'Dev', 'Echo', 'Finn', 'Gia', 'Hex', 'Ines', 'Juno', 'Kai', 'Lux', 'Mira', 'Nova', 'Orin', 'Pax'];

// ---------- renderer / scene ----------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07040f);
scene.fog = new THREE.FogExp2(0x0b0620, 0.011);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 600);
camera.position.set(6, 3.2, 42);

const labelRenderer = new CSS2DRenderer({ element: document.getElementById('labels') });

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(6, 5, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 6;
controls.maxDistance = 140;

scene.add(new THREE.AmbientLight(0x6a4cff, 0.35));
const moon = new THREE.DirectionalLight(0x9f8cff, 0.5); moon.position.set(-30, 60, 20); scene.add(moon);

// seeded random so each district looks the same every visit
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// ---------- ground: a wet, reflective street ----------
const mirror = new Reflector(new THREE.PlaneGeometry(400, 400), {
  textureWidth: Math.floor(window.innerWidth * 0.6), textureHeight: Math.floor(window.innerHeight * 0.6), color: 0x8a80a8,
});
mirror.rotation.x = -Math.PI / 2;
scene.add(mirror);
const tint = new THREE.Mesh(new THREE.PlaneGeometry(400, 400),
  new THREE.MeshStandardMaterial({ color: 0x120a26, transparent: true, opacity: 0.72, roughness: 0.4, metalness: 0.2 }));
tint.rotation.x = -Math.PI / 2; tint.position.y = 0.01;
scene.add(tint);

// stars
{
  const g = new THREE.BufferGeometry(), n = 1400, p = new Float32Array(n * 3), r = rng(3);
  for (let i = 0; i < n; i++) {
    const th = r() * Math.PI * 2, ph = r() * Math.PI * 0.45, R = 300;
    p.set([R * Math.cos(th) * Math.cos(ph), 40 + R * Math.sin(ph), R * Math.sin(th) * Math.cos(ph)], i * 3);
  }
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.9, sizeAttenuation: true, fog: false })));
}

// ---------- city layout ----------
// Each district is a 3x3 grid of blocks. Streets run along LINES in x and z (local coords).
const LINES = [-18, -6, 6, 18];
const BLOCKS = [-12, 0, 12];

function windowTexture(color, floors, cols, r) {
  const c = document.createElement('canvas'); c.width = cols * 8; c.height = floors * 8;
  const x = c.getContext('2d'); x.fillStyle = '#05030a'; x.fillRect(0, 0, c.width, c.height);
  const col = new THREE.Color(color);
  for (let f = 0; f < floors; f++) for (let k = 0; k < cols; k++) {
    const lit = r() < 0.55, b = lit ? 0.55 + r() * 0.45 : 0.06;
    x.fillStyle = `rgb(${col.r * 255 * b | 0},${col.g * 255 * b | 0},${col.b * 255 * b | 0})`;
    x.fillRect(k * 8 + 2, f * 8 + 2, 4, 5);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; return t;
}

function signTexture(text, css) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const x = c.getContext('2d'); x.fillStyle = 'rgba(0,0,0,0)'; x.fillRect(0, 0, 256, 64);
  x.font = 'bold 40px ui-monospace, Menlo, monospace'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.shadowColor = css; x.shadowBlur = 14; x.fillStyle = '#ffffff'; x.fillText(text, 128, 34);
  x.fillStyle = css; x.fillText(text, 128, 34);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

const buildingsByDistrict = new Map();

function buildDistrict(d) {
  const r = rng(d.seed), group = new THREE.Group(); group.position.x = d.offset; scene.add(group);
  const buildings = [];

  // street neon strips
  const stripMat = (c) => new THREE.MeshBasicMaterial({ color: c });
  for (const L of LINES) {
    for (const side of [-1.5, 1.5]) {
      const a = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.04, 36), stripMat(0x38e8ff)); a.position.set(L + side, 0.03, 0); group.add(a);
      const b = new THREE.Mesh(new THREE.BoxGeometry(36, 0.04, 0.08), stripMat(0xff2e88)); b.position.set(0, 0.03, L + side); group.add(b);
    }
  }
  // street lamps
  const lampMat = new THREE.MeshBasicMaterial({ color: 0xffb35c });
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x1a1430, roughness: 0.6 });
  for (const L of LINES) for (const B of BLOCKS) {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 3.2), poleMat); pole.position.set(L + 1.85, 1.6, B + 3); group.add(pole);
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 8), lampMat); bulb.position.set(L + 1.6, 3.2, B + 3); group.add(bulb);
    const pool = new THREE.Mesh(new THREE.CircleGeometry(1.6, 24), new THREE.MeshBasicMaterial({ color: 0xffa040, transparent: true, opacity: 0.12, depthWrite: false }));
    pool.rotation.x = -Math.PI / 2; pool.position.set(L + 1.4, 0.035, B + 3); group.add(pool);
  }

  // buildings, one per block; the center block of every district is its HQ
  let n = 0;
  for (const bx of BLOCKS) for (const bz of BLOCKS) {
    const type = bx === 0 && bz === 0 ? 'hub' : TYPE_KEYS[(n++ + d.seed) % 4];
    const t = TYPES[type];
    const w = 6 + r() * 1.6, depth = 6 + r() * 1.6, h = type === 'hub' ? 30 + r() * 8 : 9 + r() * 20;
    const floors = Math.round(h / 1.2), cols = Math.round(w / 1.1);
    const tex = windowTexture(t.color, floors, cols, r);
    const side = new THREE.MeshStandardMaterial({ color: 0x05030a, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.95, roughness: 0.5, metalness: 0.4 });
    const top = new THREE.MeshStandardMaterial({ color: 0x0c0818, roughness: 0.8 });
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, depth), [side, side, top, top, side, side]);
    box.position.set(bx, h / 2, bz); group.add(box);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(box.geometry), new THREE.LineBasicMaterial({ color: t.color }));
    edges.position.copy(box.position); group.add(edges);
    // neon bands every few floors
    for (let y = 4; y < h - 1; y += 6 + Math.floor(r() * 4)) {
      const band = new THREE.Mesh(new THREE.BoxGeometry(w + 0.12, 0.08, depth + 0.12), new THREE.MeshBasicMaterial({ color: t.color }));
      band.position.set(bx, y, bz); group.add(band);
    }
    // sign above the door, facing the street
    const signMat = new THREE.MeshBasicMaterial({ map: signTexture(t.name, t.css), transparent: true, depthWrite: false });
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(4, 1), signMat);
    sign.position.set(bx, 3.4, bz + depth / 2 + 0.05); group.add(sign);
    // door light
    const door = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 2.2), new THREE.MeshBasicMaterial({ color: t.color, transparent: true, opacity: 0.5 }));
    door.position.set(bx, 1.1, bz + depth / 2 + 0.04); group.add(door);

    buildings.push({ type, x: bx, z: bz, door: { x: bx, z: bz + 6 }, doorMesh: door, bandBase: 0.5, busy: 0 });
  }
  buildingsByDistrict.set(d.id, buildings);
  return group;
}

DISTRICTS.forEach(buildDistrict);

// bridges between districts
for (const x of [-32, 32]) for (const z of LINES) {
  const s = new THREE.Mesh(new THREE.BoxGeometry(28, 0.04, 0.08), new THREE.MeshBasicMaterial({ color: 0x38e8ff }));
  s.position.set(x, 0.03, z - 1.5); scene.add(s);
  const s2 = s.clone(); s2.position.z = z + 1.5; scene.add(s2);
}

// ---------- agents ----------
const isLine = (v) => LINES.some(l => Math.abs(l - v) < 1e-3);
const nearest = (arr, v) => arr.reduce((a, b) => Math.abs(b - v) < Math.abs(a - v) ? b : a);

// Route along streets only: get onto a z-street, drive to an x-street near the target, then to the door.
function route(f, t) {
  const pts = []; let cur = { x: f.x, z: f.z };
  if (!isLine(cur.z)) { cur = { x: cur.x, z: nearest(LINES, t.z) }; pts.push(cur); }
  const xi = nearest(LINES, t.x);
  if (Math.abs(cur.x - xi) > 1e-3) pts.push({ x: xi, z: cur.z });
  pts.push({ x: xi, z: t.z });
  pts.push({ x: t.x, z: t.z });
  return pts;
}

const agents = [];
const agentGeo = new THREE.CapsuleGeometry(0.28, 0.55, 4, 10);
const haloGeo = new THREE.RingGeometry(0.35, 0.55, 24);

let visitor = false;

function makeAgent(d, i, r) {
  const colorKey = TYPE_KEYS[i % TYPE_KEYS.length];
  const color = new THREE.Color(TYPES[colorKey].color).lerp(new THREE.Color(0xffffff), 0.35);
  const mesh = new THREE.Mesh(agentGeo, new THREE.MeshBasicMaterial({ color }));
  const halo = new THREE.Mesh(haloGeo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false }));
  halo.rotation.x = -Math.PI / 2; halo.position.y = -0.55;
  mesh.add(halo);
  const start = { x: LINES[Math.floor(r() * 4)], z: BLOCKS[Math.floor(r() * 3)] };
  mesh.position.set(d.offset + start.x, 0.6, start.z);
  scene.add(mesh);

  const el = document.createElement('div'); el.className = 'tag'; el.style.opacity = 0;
  const label = new CSS2DObject(el); label.position.set(0, 0.9, 0); mesh.add(label);

  const name = d.owner ? NAMES[i % NAMES.length] : `${d.name.split(' ')[0]}-${i + 1}`;
  return { d, name, mesh, halo, el, label, pos: { ...start }, path: [], state: 'idle', timer: 0.3 + r() * 3,
    target: null, spot: null, task: null, speed: 2.4 + r() * 1.2, lane: (r() - 0.5) * 0.9, phase: r() * 6, r };
}

DISTRICTS.forEach(d => { const r = rng(d.seed + 99); for (let i = 0; i < d.agents; i++) agents.push(makeAgent(d, i, r)); });

function pickJob(a) {
  const blds = buildingsByDistrict.get(a.d.id);
  const taken = new Set(agents.filter(o => o !== a && o.d === a.d && o.spot).map(o => o.spot.key));
  const order = blds.filter(b => b !== a.last).sort(() => a.r() - 0.5);
  for (const b of order) {
    for (const dx of [-1.6, -0.5, 0.6, 1.7]) {
      const key = b.x + ':' + dx;
      if (taken.has(key)) continue;
      a.spot = { key, x: b.x + dx, z: b.door.z };
      a.target = b; a.path = route(a.pos, a.spot); a.state = 'walking';
      const tasks = TYPES[b.type].tasks; a.task = tasks[Math.floor(a.r() * tasks.length)];
      return;
    }
  }
  a.timer = 1;
}

const logEl = document.getElementById('log'); const entries = [];
function log(a, text) {
  if (!a.d.owner) return;
  entries.unshift({ t: new Date(), name: a.name, text, where: TYPES[a.target.type].name });
  if (entries.length > 30) entries.pop();
  renderLog();
}
function renderLog() {
  logEl.innerHTML = entries.map(e => {
    const time = e.t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    return `<li>${time} · <b>${e.name}</b> ${visitor ? 'was active at ' + e.where : e.text}</li>`;
  }).join('') || '<li>Agents are heading to work…</li>';
}

function updateAgent(a, dt, now) {
  if (a.path.length) {
    const n = a.path[0], dx = n.x - a.pos.x, dz = n.z - a.pos.z, dist = Math.hypot(dx, dz), step = a.speed * dt;
    if (dist <= step) { a.pos = { x: n.x, z: n.z }; a.path.shift(); }
    else { a.pos.x += dx / dist * step; a.pos.z += dz / dist * step; }
    if (!a.path.length && a.state === 'walking') {
      a.state = 'working'; a.timer = 6 + a.r() * 8; a.target.busy++;
      log(a, `started <i>${a.task}</i> at ${TYPES[a.target.type].name}`);
    }
  } else {
    a.timer -= dt;
    if (a.state === 'working' && a.timer <= 0) {
      log(a, `finished <i>${a.task}</i>`);
      a.target.busy--; a.last = a.target; a.state = 'idle'; a.spot = null; a.task = null; a.timer = 0.6 + a.r() * 1.5;
    } else if (a.state === 'idle' && a.timer <= 0) pickJob(a);
  }
  // lane offset keeps walkers from overlapping; bob while walking
  const walking = a.path.length > 0;
  const onZ = a.path.length && Math.abs(a.path[0].z - a.pos.z) < 1e-3;
  const lx = walking && !onZ ? a.lane : 0, lz = walking && onZ ? a.lane : 0;
  a.mesh.position.set(a.d.offset + a.pos.x + lx, 0.6 + (walking ? Math.abs(Math.sin(now * 0.008 + a.phase)) * 0.12 : 0), a.pos.z + lz);
  a.halo.material.opacity = a.state === 'working' ? 0.35 + Math.sin(now * 0.005 + a.phase) * 0.2 : 0.25;
}

function updateLabel(a, now) {
  const dist = camera.position.distanceTo(a.mesh.position);
  const hidden = !a.d.owner || visitor;
  let html = '', cls = 'tag';
  if (a.state === 'working') {
    if (hidden) { html = '•'.repeat(1 + Math.floor(now / 450 + a.phase) % 3); cls += ' private'; }
    else html = `<b>${a.name}</b> · ${a.task}`;
  } else if (a.state === 'walking' && !hidden) { html = `${a.name} → ${TYPES[a.target.type].name}`; cls += ' walk'; }
  if (a._html !== html) { a.el.innerHTML = html; a._html = html; }
  if (a._cls !== cls) { a.el.className = cls; a._cls = cls; }
  const c = a.target ? TYPES[a.target.type].css : '#fff';
  if (a._c !== c) { a.el.style.borderColor = c; a._c = c; }
  a.el.style.opacity = html && dist < (hidden ? 60 : 55) ? 1 : 0;
}

// ---------- post-processing ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.75, 0.5, 0.32);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h); labelRenderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

// ---------- HUD ----------
const legend = document.getElementById('legend');
legend.innerHTML = Object.values(TYPES).map(t => `<span><i class="sw" style="background:${t.css};box-shadow:0 0 8px ${t.css}"></i>${t.name}</span>`).join('');

let fly = null;
const views = {
  mine: { pos: [6, 3.2, 42], target: [6, 5, 0] },
  neon: { pos: [-64, 16, 44], target: [-64, 3, 0] },
  harbor: { pos: [64, 16, 44], target: [64, 3, 0] },
  overview: { pos: [0, 70, 95], target: [0, 0, 0] },
};
const btnWrap = document.getElementById('districts');
[...DISTRICTS.map(d => ({ id: d.id, label: d.owner ? d.name : 'Visit ' + d.name })), { id: 'overview', label: 'Whole city' }].forEach(v => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = v.label; b.dataset.view = v.id;
  b.addEventListener('click', () => goTo(v.id)); btnWrap.appendChild(b);
});
function goTo(id) {
  const v = views[id];
  fly = { t: 0, fromP: camera.position.clone(), fromT: controls.target.clone(), toP: new THREE.Vector3(...v.pos), toT: new THREE.Vector3(...v.target) };
  btnWrap.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === id)));
}
btnWrap.querySelector('[data-view="mine"]').setAttribute('aria-pressed', 'true');

document.getElementById('visitor').addEventListener('change', e => { visitor = e.target.checked; renderLog(); });

// ---------- loop ----------
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), now = performance.now();
  agents.forEach(a => updateAgent(a, dt, now));
  for (const blds of buildingsByDistrict.values()) for (const b of blds) {
    b.doorMesh.material.opacity = b.busy > 0 ? 0.65 + Math.sin(now * 0.006) * 0.2 : 0.25;
  }
  if (fly) {
    fly.t = Math.min(1, fly.t + dt / 1.6);
    const e = fly.t < 0.5 ? 2 * fly.t * fly.t : 1 - Math.pow(-2 * fly.t + 2, 2) / 2;
    camera.position.lerpVectors(fly.fromP, fly.toP, e); controls.target.lerpVectors(fly.fromT, fly.toT, e);
    if (fly.t >= 1) fly = null;
  }
  controls.update();
  agents.forEach(a => updateLabel(a, now));
  composer.render();
  labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
